[workspace]
members = ["crates/clanky-core", "crates/clanky-render", "crates/clanky-api", "crates/clanky", "crates/clanky-state", "crates/clanky-gpui", "crates/clanky-vt", "crates/clanky-vte", "crates/clanky-edit", "crates/clanky-mask", "crates/clanky-syntax"]
resolver = "3"

[workspace.package]
version = "1.8.0-dev.4"
edition = "2024"
license = "MIT OR Apache-2.0"


# No debug information in any build; release binaries are stripped.
[profile.dev]
debug = false

[profile.test]
debug = false

[profile.release]
debug = false
strip = true

[profile.bench]
debug = false
