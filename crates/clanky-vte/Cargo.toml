# Forked by the Clanky project from the crates.io release named in FORK.md.
# Renamed, published = false; see FORK.md for every change.

[package]
publish = false
repository = "https://github.com/rustytensor/clanky"
edition = "2021"
rust-version = "1.62.1"
name = "clanky-vte"
version = "0.15.0"
authors = [
    "Joe Wilm <joe@jwilm.com>",
    "Christian Duerr <contact@christianduerr.com>",
]
build = false
exclude = ["/.travis.yml"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Parser for implementing terminal emulators"
readme = "README.md"
keywords = [
    "ansi",
    "vte",
    "parser",
    "terminal",
]
categories = [
    "parsing",
    "no-std",
]
license = "Apache-2.0 OR MIT"

[features]
ansi = [
    "log",
    "cursor-icon",
    "bitflags",
]
default = ["std"]
serde = ["dep:serde"]
std = ["memchr/std"]

[lib]
name = "clanky_vte"
path = "src/lib.rs"

[[example]]
name = "parselog"
path = "examples/parselog.rs"

[dependencies.arrayvec]
version = "0.7.2"
default-features = false

[dependencies.bitflags]
version = "2.3.3"
optional = true
default-features = false

[dependencies.cursor-icon]
version = "1.0.0"
optional = true
default-features = false

[dependencies.log]
version = "0.4.17"
optional = true

[dependencies.memchr]
version = "2.7.4"
default-features = false

[dependencies.serde]
version = "1.0.160"
features = ["derive"]
optional = true
